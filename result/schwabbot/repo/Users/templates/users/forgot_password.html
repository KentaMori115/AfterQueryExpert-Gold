{% extends 'userbase.html' %}
{% load static %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-secondary text-white">
                        <h4 class="mb-0">Password Change Request</h4>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-center align-items-center vh-20">
                            <form method="post" action="{% url 'forgot_password' %}" class="border p-4 bg-light rounded form-container">
                                {% csrf_token %}
                                {{ form.as_p }}
                                <!-- Submit Button -->
                                <button type="submit" class="btn btn-success w-100">{{button_content}}</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block script %}
    {{ block.super }}
{% endblock %}
