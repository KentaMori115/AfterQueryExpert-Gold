[metadata]
task_id = "event-effects"
display_title = "Apply an authored disturbance the way the capsule wrote it"
display_description = "BiomeWeaver decodes four fields on every event effect and a tick reads two of them, then puts one quantity onto every region's pool and reports a number the run never made. Give effects a region and a window, split a quantity over the pools that hold the resource, publish a flow per pool that moved, and let a modifier effect scale renewal while it runs."
