display_description = "sheave treats a winding rope as a string that either holds or does not, so nothing in it knows that a kilometre of rope under a loaded skip gives better than a metre and that a wind which stops does not stop. Add the elastic side: how stiff a hanging rope is, how far it gives, what mass swings on the end of it, and what an emergency stop leaves in it at each point of a wind."
