schema_version = "1.1"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "afterquery/match-void-rescore"

[metadata]
task_id = "match-void-rescore"
display_title = "Withdraw a match result and rescore the ladder around it"
display_description = "ArenaFlow can void a match in its domain layer and no service ever calls it, so a result that should never have counted keeps its points. Add a withdrawal path that rebuilds every affected score record from the results that survive, drops bonuses a later win only reached through the voided one, carries the rebuilt records on the event so replay agrees, keeps a ledger of what moved, and measures rank movement against a published board."
category = "feature_request"
language = "typescript"
repository_url = "platform://gold/repos/PENDING_REPO_ID"
base_commit_hash = "PENDING_BASE_COMMIT"

[agent]
timeout_sec = 5400

