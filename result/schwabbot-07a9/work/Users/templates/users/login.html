{% extends 'userbase.html' %}

{% block content %}
<style>
    .form-container {
        max-width: 500px; /* Limit the maximum width of the form */
        width: 100%; /* Ensure it takes up full width on smaller devices */
        
    }
</style>
<div class="row mb-3 mt-5">
    <h2 class="text-center">Schwab Trading Bot Login</h2>
</div>

<div class="d-flex justify-content-center align-items-center vh-20">
    <form method="post" class="border p-4 bg-light rounded form-container">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">Login</button>
        <p class="mt-2">
            <a href="{% url 'forgot_password' %}"><span class="text-primary">Forgot Password ?</span></a>
        </p>
        
    </form>
</div>

{% endblock %}
