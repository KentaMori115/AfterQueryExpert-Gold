name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: run the suite
        run: python -m unittest discover -q -s tests -t .
      - name: run the demo
        run: python -m layover demo --summary
      - name: run the command line
        run: python -m layover --help
