display_title = "Answer a Range header from the chunks a file was stored in"
display_description = "A chunked upload is only ever served whole, so a lost transfer starts again and nothing can seek. Add planRangedResponse, which measures a Range header against the chunk manifest and returns the reads that answer it, the stretches the answer carries, and the length of the body they make."
