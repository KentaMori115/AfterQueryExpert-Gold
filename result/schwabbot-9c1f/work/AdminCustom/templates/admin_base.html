{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot</title>
    <link   rel="stylesheet" 
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
            >
    <link href="{% static 'css/styles.css' %}">
</head>
<body onload="funcOnLoad()">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-container {
            max-width: 600px; /* Limit the maximum width of the form */
            width: 100%; /* Ensure it takes up full width on smaller devices */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            min-height: 100vh;
            background-color: #f5f5f5;
        }
        
        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            transition: all 0.3s;
            height: 100vh;
            position: fixed;
            overflow-y: auto;
        }
        
        .sidebar-header {
            padding: 25px;
            background: #1a252f;
            display: flex;
            align-items: center;
        }
        
        .sidebar-header h3 {
            margin-left: 10px;
            font-size: 1.2rem;
        }
        
        .sidebar-menu {
            padding: 20px 0;
        }
        
        .sidebar-menu h4 {
            color: #b8c7ce;
            font-size: 12px;
            padding: 15px 20px 10px;
            text-transform: uppercase;
            font-weight: 600;
        }
        
        .sidebar-menu ul {
            list-style: none;
        }
        
        .sidebar-menu li {
            padding: 10px 20px;
            transition: all 0.3s;
        }
        
        .sidebar-menu li:hover {
            background: #1a252f;
            cursor: pointer;
        }
        
        .sidebar-menu li.active {
            background: #3d566e;
            border-left: 3px solid #3498db;
        }
        
        .sidebar-menu li a {
            color: #b8c7ce;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        
        .sidebar-menu li a i {
            margin-right: 10px;
            font-size: 18px;
        }
        
        .sidebar-menu li:hover a,
        .sidebar-menu li.active a {
            color: white;
        }
        
        .sidebar-collapse {
            width: 80px;
            text-align: center;
        }
        
        .sidebar-collapse .sidebar-header h3,
        .sidebar-collapse .sidebar-menu h4,
        .sidebar-collapse .sidebar-menu li a span {
            display: none;
        }
        
        .sidebar-collapse .sidebar-menu li a {
            justify-content: center;
        }
        
        .sidebar-collapse .sidebar-menu li a i {
            margin-right: 0;
            font-size: 20px;
        }
        
        .toggle-btn {
            position: absolute;
            right: 0px;
            top: 20px;
            background: #2c3e50;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid white;
            z-index: 1;
        }
        
        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 20px;
            transition: all 0.3s;
        }
        
        .collapsed-main {
            margin-left: 80px;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }
            
            .sidebar-header h3,
            .sidebar-menu h4,
            .sidebar-menu li a span {
                display: none;
            }
            
            .sidebar-menu li a {
                justify-content: center;
            }
            
            .sidebar-menu li a i {
                margin-right: 0;
                font-size: 20px;
            }
            
            .main-content {
                margin-left: 80px;
            }
        }
    </style>

    <!-- Left Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Admin Panel</h3>
        </div>
        
        <div class="toggle-btn" onclick="toggleSidebar()">
            <i class="fas fa-angle-left" id="toggle-icon"></i>
        </div>
        
        <div class="sidebar-menu">
            <h4>Main</h4>
            <ul>
                <li {% if page_name == 'admin_home'%} class="active" {% endif %}>
                    <a href="{% url 'admin_home' %}">
                        <i class="fas fa-file-alt"></i>
                        <span>Admin</span>
                    </a>
                </li>
            </ul>
            <ul>
                <li>
                    <a href="{% url 'bots' %}">
                        <i class="fas fa-television"></i>
                        <span>Home</span>
                    </a>
                </li>
            </ul>            
            <ul>
                <li>
                    <a href="{% url 'logout' %}">
                        <i class="fas fa-sign-out-alt"></i>
                        <span href = "bots">Log out</span>
                    </a>
                </li>
            </ul>            
            
            <h4>Management</h4>
            <ul>
                <li {% if page_name == 'user_allow'%} class="active" {% endif %}>
                    <a href="{% url 'user_allow' %}">
                        <i class="fas fa-user-check"></i>
                        <span>User-Allow-In</span>
                    </a>
                </li>
                <li {% if page_name == 'user_bot_onoff'%} class="active" {% endif %}>
                    <a href="{% url 'user_bot_onoff' %}">
                        <i class="fas fa-plug"></i>
                        <span>User-Bot-OnOff</span>
                    </a>
                </li>
                <li {% if page_name == 'user_pwd_allow'%} class="active" {% endif %}>
                    <a href="{% url 'user_pwd_allow' %}">
                        <i class="fas fa-unlock"></i>
                        <span>User-Allow-Pwd</span>
                    </a>
                </li>
                <li {% if page_name == 'user_token'%} class="active" {% endif %}>
                    <a href="{% url 'user_token' %}">
                        <i class="fas fa-user-tag"></i>
                        <span>User-Token</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <i class="fas fa-box"></i>
                        <span>Bots</span>
                    </a>
                </li>
            </ul>
            
            <h4>Content</h4>
            <ul>
                <li {% if page_name == 'order_table'%} class="active" {% endif %}>
                    <a href="{% url 'order_table' %}">
                        <i class="fas fa-shopping-cart"></i>
                        <span>Orders</span>
                    </a>
                </li>
            </ul>
            
            <h4>Setting</h4>
            <ul>
                <li {% if page_name == 'bot_run_setting'%} class="active" {% endif %}>
                    <a href="{% url 'bot_run_setting' %}">
                        <i class="fas fa-cog"></i>
                        <span>Run Settings</span>
                    </a>
                </li>
                <li {% if page_name == 'risk_budget'%} class="active" {% endif %}>
                    <a href="{% url 'risk_budget' %}">
                        <i class="fas fa-shield-alt"></i>
                        <span>Risk Budget</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <br>
    {% block content %}{% endblock %}

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script type="text/javascript" src="https://code.jquery.com/jquery-1.7.1.min.js"></script>

</body>
