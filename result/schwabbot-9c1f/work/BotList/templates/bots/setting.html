{% extends 'bot_base.html' %}
{% load static %}

{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-secondary text-white">
                        <h4 class="mb-0">Change Password</h4>
                    </div>
                    <div class="card-body">
                        <form id = "change_password_form">
                            <!-- New Password -->
                            <div class="mb-3">
                                <label for="input_new_password" class="form-label">New Password</label>
                                <input type="password" class="form-control" id="input_new_password" placeholder="New Password" required>
                            </div>
                            
                            <!-- New Password -->
                            <div class="mb-3">
                                <label for="input_confirm_password" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="input_confirm_password" placeholder="Confirm Password" required>
                            </div>

                            <!-- Submit Button -->
                            <button type="button" class="btn btn-success" onclick="changePasword()">Change Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>


{% endblock %}

{% block script %}
    {{ block.super }}
    <script src="{% static 'js/config_3.13.js' %}"></script>
    <script  src="{% static 'js/setting_3.13.js' %}"></script>
{% endblock %}
