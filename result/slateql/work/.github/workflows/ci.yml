name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff==0.16.4

      - name: Lint
        run: ruff check slateql tests conftest.py examples

  examples:
    name: examples and CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package
        run: python -m pip install -e .

      - name: Run every example script
        run: |
          for script in examples/*.py; do
            echo "== $script"
            python "$script" > /dev/null
          done

      - name: Exercise the command line interface
        run: |
          slateql --version
          slateql --csv customers=data/customers.csv --csv orders=data/orders.csv \
            query "SELECT c.city, COUNT(*) AS n
                   FROM customers c JOIN orders o ON o.customer_id = c.id
                   GROUP BY c.city ORDER BY n DESC, c.city"
          slateql --jsonl events=data/events.jsonl \
            explain "SELECT kind, COUNT(*) FROM events GROUP BY kind"
          slateql --csv orders=data/orders.csv schema orders --analyze
